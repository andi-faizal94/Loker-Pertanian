name: Cek perintah /loker

on:
  schedule:
    - cron: "*/10 * * * *"   # setiap 10 menit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cek-perintah
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cek perintah di Telegram
        id: cek
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q requests
          python cek_perintah.py

      - name: Install
        if: steps.cek.outputs.ada == '1'
        run: pip install -q -r requirements.txt

      - name: Scrape & kirim
        if: steps.cek.outputs.ada == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIRIM_JIKA_KOSONG: "1"
        run: python scraper.py

      - name: Simpan daftar loker yang sudah dikirim
        if: steps.cek.outputs.ada == '1' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "update seen.json"
          git pull --rebase --autostash && git push
