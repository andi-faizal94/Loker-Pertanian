name: Loker Pertanian ke Telegram

on:
  schedule:
    - cron: "17 0 * * *"   # setiap hari 07:17 WIB (00:17 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tes saja (tidak mengirim pesan)?"
        type: boolean
        default: true
      kirim_jika_kosong:
        description: "Kirim pesan 'belum ada loker baru' bila kosong?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: loker-harian
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape & kirim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          KIRIM_JIKA_KOSONG: ${{ inputs.kirim_jika_kosong && '1' || '' }}
        run: python scraper.py

      - name: Simpan halaman debug kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.html
          if-no-files-found: ignore

      - name: Simpan daftar loker yang sudah dikirim
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for f in seen.json riwayat.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "update seen.json"
          git pull --rebase --autostash && git push
